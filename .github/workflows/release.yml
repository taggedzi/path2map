name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Assign date version
        id: version
        run: |
          set -euo pipefail
          git fetch --tags --force
          git tag --list 'v*' > "$RUNNER_TEMP/tags.txt"
          VERSION="$(python scripts/release_version.py prepare --tags-file "$RUNNER_TEMP/tags.txt")" || exit
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install project with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run black (check mode)
        run: python -m black --check .

      - name: Run ruff
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy src

      - name: Run pytest with coverage
        run: python -m pytest --cov=path2map --cov-report=term-missing

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate artifact metadata
        run: python -m twine check dist/*

      - name: Smoke-test the wheel version
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/pkg-smoke"
          "$RUNNER_TEMP/pkg-smoke/bin/python" -m pip install --no-deps dist/path2map-*.whl
          got="$("$RUNNER_TEMP/pkg-smoke/bin/path2map" --version)"
          if [[ "$got" != "path2map ${VERSION}" ]]; then
            echo "wheel version mismatch: expected path2map ${VERSION}, got ${got}" >&2
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

      - name: Commit and push the version
        id: publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pyproject.toml src/path2map/__init__.py CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Release metadata already committed."
          else
            git commit -m "Release v${VERSION}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release and attach artifacts
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ steps.publish.outputs.sha }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
